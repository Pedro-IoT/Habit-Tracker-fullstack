services:
  db:
    image: 'pgvector/pgvector:pg16'
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mydatabase}
      POSTGRES_USER: ${DB_USERNAME:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-mydatabase}
      DB_USERNAME: ${DB_USERNAME:-myuser}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-file:/run/secrets/app.pub}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-file:/run/secrets/app.key}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://example.com}
      APP_COOKIE_DOMAIN: ${APP_COOKIE_DOMAIN:-}
      APP_WEBAUTHN_ENABLED: ${APP_WEBAUTHN_ENABLED:-false}
      APP_WEBAUTHN_RP_NAME: ${APP_WEBAUTHN_RP_NAME:-habit-tracker}
      APP_WEBAUTHN_RP_ID: ${APP_WEBAUTHN_RP_ID:-example.com}
    ports:
      - '8080:8080'
    volumes:
      - ./secrets/app.pub:/run/secrets/app.pub:ro
      - ./secrets/app.key:/run/secrets/app.key:ro

volumes:
  postgres_data:
